name: retro68-coreutils

on:
  push:
    branches: [main]
    paths: ["retro68-coreutils/**", ".github/workflows/retro68-coreutils.yml"]
  pull_request:
    paths: ["retro68-coreutils/**", ".github/workflows/retro68-coreutils.yml"]

jobs:
  host-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (host)
        run: make -C retro68-coreutils
      - name: Test
        run: make -C retro68-coreutils test
